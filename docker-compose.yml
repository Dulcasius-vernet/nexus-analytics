services:
  db:
    image: postgres:16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_analytics
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: local_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_app -d nexus_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nexus_pgdata:
